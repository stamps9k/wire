<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wire debug</title>
<style>
  :root {
    --bg: #111418;
    --panel: #1a1f25;
    --line: #262c34;
    --text: #d6dbe1;
    --dim: #7d8794;
    --ok: #6cc28a;
    --info: #6aa8e8;
    --warn: #e2b55a;
    --bad: #e8736a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 14px; font-weight: 600; }
  #state::before { content: "\25CF  "; }
  #state.open { color: var(--ok); }
  #state.connecting { color: var(--warn); }
  #state.closed { color: var(--bad); }
  #count { color: var(--dim); }
  .spacer { flex: 1; }
  button, label {
    font: inherit;
    color: var(--text);
  }
  button {
    background: var(--line);
    border: 1px solid #3a424d;
    border-radius: 4px;
    padding: 2px 10px;
    cursor: pointer;
  }
  button:hover { background: #333b45; }
  label { display: flex; align-items: center; gap: 4px; color: var(--dim); }
  #reconnect-state { font-weight: 600; min-width: 3ch; }
  #reconnect-state.on { color: var(--ok); }
  #reconnect-state.off { color: var(--bad); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 6px 16px;
  }
  .line { white-space: pre-wrap; word-break: break-all; }
  .line > span + span { margin-left: 1ch; }
  .time, .id, .peer, .meta { color: var(--dim); }
  .s1 { color: var(--info); }
  .s2 { color: var(--ok); }
  .s4, .rejected { color: var(--warn); }
  .s5, .error { color: var(--bad); }
  .system { color: var(--info); font-style: italic; }
  .raw { color: var(--dim); }
</style>

<header>
  <h1>wire debug</h1>
  <span id="state" class="connecting">connecting</span>
  <span id="count">0 events</span>
  <span class="spacer"></span>
  <label title="Reconnect automatically when the connection drops">
    <input type="checkbox" id="reconnect" checked>
    auto-reconnect: <span id="reconnect-state" class="on">on</span>
  </label>
  <button id="toggle" type="button">Disconnect</button>
  <button id="clear" type="button">Clear</button>
</header>
<main id="log"></main>

<script>
  "use strict";

  // Every string from the server is client-controlled (targets, user agents),
  // so lines are only ever built with textContent, never innerHTML.

  const MAX_LINES = 1000;
  const RETRY_MIN_MS = 500;
  const RETRY_MAX_MS = 10000;

  const log = document.getElementById("log");
  const stateEl = document.getElementById("state");
  const countEl = document.getElementById("count");
  const toggle = document.getElementById("toggle");
  const reconnect = document.getElementById("reconnect");
  const encoder = new TextEncoder();

  let socket = null;
  let count = 0;
  let retryMs = RETRY_MIN_MS;
  let retryTimer = null;
  let closedByUser = false;

  function setState(name, text) {
    stateEl.className = name;
    stateEl.textContent = text;
    toggle.textContent = name === "closed" ? "Connect" : "Disconnect";
  }

  function pad(n, width) {
    return String(n).padStart(width, "0");
  }

  function time(ms) {
    const d = typeof ms === "number" ? new Date(ms) : new Date();
    return pad(d.getHours(), 2) + ":" + pad(d.getMinutes(), 2) + ":" +
      pad(d.getSeconds(), 2) + "." + pad(d.getMilliseconds(), 3);
  }

  function span(text, cls) {
    const el = document.createElement("span");
    el.textContent = text;
    if (cls) el.className = cls;
    return el;
  }

  // Shows a client string, marking it when the server truncated it.
  function capped(value, length) {
    if (typeof value !== "string") return "";
    const bytes = encoder.encode(value).length;
    return typeof length === "number" && length > bytes
      ? value + "…(" + length + " B)"
      : value;
  }

  function statusClass(status) {
    return typeof status === "number" ? "s" + Math.floor(status / 100) : "";
  }

  function append(parts, cls) {
    const atBottom =
      log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    const line = document.createElement("div");
    line.className = "line" + (cls ? " " + cls : "");
    for (const part of parts) line.append(part);
    log.append(line);
    while (log.childElementCount > MAX_LINES) {
      log.firstElementChild.remove();
    }
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  function system(text, cls) {
    append([span(time(), "time"), span(text)], cls || "system");
  }

  function common(e) {
    return [
      span(time(e.timestamp_ms), "time"),
      span("#" + e.connection_id, "id"),
      span(String(e.peer_address), "peer"),
    ];
  }

  function requestLine(e) {
    const parts = common(e);
    parts.push(span(String(e.method)));
    parts.push(span(capped(e.target, e.target_length)));
    parts.push(span(String(e.status), statusClass(e.status)));
    parts.push(span(
      e.duration_ms + " ms  " + e.bytes_received + " B  host=" +
      e.host_class + "  headers=" + e.header_count, "meta"));
    if (e.user_agent !== null && e.user_agent !== undefined) {
      parts.push(span("ua=" + capped(e.user_agent, e.user_agent_length),
        "meta"));
    }
    append(parts);
  }

  function rejectedLine(e) {
    const parts = common(e);
    parts.push(span("REJECTED " + e.reason, "rejected"));
    if (e.detail) parts.push(span(String(e.detail)));
    parts.push(span(e.status === null ? "(no response)" : String(e.status),
      statusClass(e.status)));
    parts.push(span(e.duration_ms + " ms  " + e.bytes_received + " B",
      "meta"));
    append(parts);
  }

  function onMessage(message) {
    count += 1;
    countEl.textContent = count + (count === 1 ? " event" : " events");

    let e;
    try {
      e = JSON.parse(message.data);
    } catch {
      append([span(time(), "time"), span(String(message.data))], "raw");
      return;
    }

    switch (e && e.kind) {
      case "request": requestLine(e); break;
      case "rejected": rejectedLine(e); break;
      default:
        append([span(time(e && e.timestamp_ms), "time"),
          span(JSON.stringify(e))], "raw");
    }
  }

  function connect() {
    clearTimeout(retryTimer);
    retryTimer = null;
    closedByUser = false;
    setState("connecting", "connecting");
    const url = "ws://" + location.host + "/ws";
    socket = new WebSocket(url);

    socket.addEventListener("open", () => {
      retryMs = RETRY_MIN_MS;
      setState("open", "open");
      system("connected to " + url);
    });

    socket.addEventListener("message", onMessage);

    // Browsers give no details on "error"; a "close" always follows it.
    socket.addEventListener("error", () => {
      system("socket error", "error");
    });

    socket.addEventListener("close", (e) => {
      setState("closed", "closed " + e.code);
      system("closed: code " + e.code +
        (e.reason ? " reason \"" + e.reason + "\"" : "") +
        (e.wasClean ? " (clean)" : " (not clean)"),
        e.wasClean ? "system" : "error");
      socket = null;
      if (!closedByUser && reconnect.checked) {
        system("reconnecting in " + retryMs + " ms");
        retryTimer = setTimeout(connect, retryMs);
        retryMs = Math.min(retryMs * 2, RETRY_MAX_MS);
      }
    });
  }

  toggle.addEventListener("click", () => {
    if (socket) {
      closedByUser = true;
      socket.close(1000, "bye");
    } else {
      retryMs = RETRY_MIN_MS;
      connect();
    }
  });

  const reconnectState = document.getElementById("reconnect-state");
  function showReconnect() {
    const on = reconnect.checked;
    reconnectState.textContent = on ? "on" : "off";
    reconnectState.className = on ? "on" : "off";
  }
  reconnect.addEventListener("change", () => {
    showReconnect();
    // Turning it off also cancels a reconnect that is already waiting.
    if (!reconnect.checked && retryTimer !== null && socket === null) {
      clearTimeout(retryTimer);
      retryTimer = null;
      system("auto-reconnect off: pending reconnect cancelled");
    }
  });
  // Browsers can restore a checkbox's state on reload, so sync once here.
  showReconnect();

  document.getElementById("clear").addEventListener("click", () => {
    log.replaceChildren();
    count = 0;
    countEl.textContent = "0 events";
  });

  connect();
</script>
